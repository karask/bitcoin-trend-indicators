[project]
name = "bitcoin-regime-research"
version = "0.1.0"
description = "DuckDB-backed research API for transparent Bitcoin regime indicators"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bitcoin_regime*"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
